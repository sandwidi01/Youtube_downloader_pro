services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FIREBASE_CREDENTIALS: /secrets/firebase.json
    volumes:
      - downloads:/data/downloads
      - ./secrets:/secrets:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  downloads:
  caddy_data:
